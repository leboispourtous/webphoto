<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Galerie 3 - Leboispourtous</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #ffffff; display: flex; flex-direction: column; background-color: #1e140f; }
        header { background-color: rgba(30, 20, 15, 0.95); text-align: center; padding: 12px 10px; border-bottom: 2px solid #3a2b22; flex-shrink: 0; }
        header h1 { font-size: 1.3em; color: #ffffff; }
        main { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
        .navigation-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; }
        .btn-nav { flex: 1; padding: 12px 10px; color: #ffffff; font-weight: bold; font-size: 0.95em; text-decoration: none; border-radius: 6px; border: 2px solid #ffffff; background: #6e4620; transition: all 0.2s ease; text-align: center; }
        .photo-grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; overflow: hidden; }
        .photo-grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        footer { background-color: rgba(20, 13, 10, 0.95); color: #d1c2b5; text-align: center; padding: 10px; font-size: 0.85em; flex-shrink: 0; border-top: 1px solid rgba(122, 62, 16, 0.3); }
    </style>
</head>
<body>
    <audio id="monLecteur" src="musique.mp3" loop></audio>
    <header><h1>Galerie Photos</h1></header>
    <main>
        <div class="navigation-bar">
            <a href="galerie-2.html" class="btn-nav">&larr; Précédent</a>
            <a href="galerie-4.html" class="btn-nav">Suivant &rarr;</a>
        </div>
        <div class="photo-grid">
            <img src="14.jpg" alt="Photo 14"><img src="15.jpg" alt="Photo 15">
            <img src="16.jpg" alt="Photo 16"><img src="17.jpg" alt="Photo 17">
            <img src="18.jpg" alt="Photo 18"><img src="19.jpg" alt="Photo 19">
        </div>
    </main>
    <footer><p>&copy; leboispourtous &mdash; page 3/8</p></footer>
    <script>
        const audio = document.getElementById('monLecteur');
        if(localStorage.getItem('musicPlaying') === 'true') {
            audio.currentTime = localStorage.getItem('musicTime') || 0;
            audio.play().catch(() => {});
        }
        setInterval(() => { if(!audio.paused) { localStorage.setItem('musicTime', audio.currentTime); } }, 500);
        setTimeout(function() { window.location.href = "galerie-4.html"; }, 5000);
    </script>
</body>
</html>
