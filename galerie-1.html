<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Galerie - Leboispourtous</title>
    <style>
        /* Réinitialisation complète */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Conteneur principal fixe sans défilement avec un fond sombre et uni */
        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            
            /* Ligne corrigée : Fond uni pour supprimer définitivement la grille d'arrière-plan parasite */
            background-color: #1e140f;
        }

        /* En-tête */
        header {
            background-color: rgba(30, 20, 15, 0.95); 
            text-align: center;
            padding: 15px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
            backdrop-filter: blur(3px); 
        }
        
        header h1 { 
            font-size: 1.3em; 
            color: #d1c2b5; 
        }

        /* Contenu central */
        main {
            flex: 1; 
            padding: 20px;
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            overflow: hidden;
        }

        /* Cadre du Diaporama au centre */
        .diaporama-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1; /* Rendu carré net */
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #d1c2b5;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            
            /* Ligne corrigée : Fond marron solide et totalement opaque */
            background-color: #2c221e; 
        }

        /* Style des images du carrousel */
        .diaporama-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; /* Masquées par défaut */
            
            /* Animation totale de 15 secondes pour 3 images (5 secondes chacune) */
            animation: defilementImages 15s infinite ease-in-out;
        }

        /* Décalage précis de 5 secondes pour enchaîner proprement les photos */
        .photo-1 { animation-delay: 0s; }
        .photo-2 { animation-delay: 5s; }
        .photo-3 { animation-delay: 10s; }

        /* Lignes corrigées : Animation fluide de transition sans aucun trou de transparence */
        @keyframes defilementImages {
            0%, 5% { opacity: 0; }
            10%, 33.33% { opacity: 1; } /* Entièrement opaque et visible pendant 5s */
            38%, 100% { opacity: 0; }   /* S'efface proprement */
        }

        /* Barre de navigation avec les boutons */
        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 280px;
            flex-shrink: 0;
        }

        /* Boutons Accueil et Objectifs */
        .btn-nav {
            flex: 1;
            padding: 12px 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95em;
            text-decoration: none; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #a65d21;
            background: linear-gradient(145deg, #5c3a1a, #422812);
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            border-color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
        }

        /* Pied de page */
        footer {
            background-color: rgba(20, 13, 10, 0.95); 
            color: #aaa;
            text-align: center; 
            padding: 10px; 
            font-size: 0.75em; 
            flex-shrink: 0;
            border-top: 1px solid rgba(122, 62, 16, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Galerie Photos - Leboispourtous</h1>
    </header>

    <main>
        <!-- Diaporama central parfaitement étanche -->
        <div class="diaporama-container">
            <img src="10.jpg" alt="Création 1" class="photo-1">
            <img src="5.jpg" alt="Création 2" class="photo-2">
            <img src="6.jpg" alt="Création 3" class="photo-3">
        </div>
        
        <!-- Boutons de navigation bas -->
        <div class="navigation-bar">
            <a href="index.html" class="btn-nav">Accueil</a>
            <a href="objectifs.html" class="btn-nav">Objectifs</a>
        </div>
    </main>

    <footer>
        <p>&copy; leboispourtous</p>
    </footer>

</body>
</html>
