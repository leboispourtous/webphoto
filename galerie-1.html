<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Galerie 1 - Leboispourtous</title>
    <style>
        /* Réinitialisation complète */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Structure de l'écran fixe */
        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            background-color: #1e140f;
        }

        /* En-tête */
        header {
            background-color: rgba(30, 20, 15, 0.95); 
            text-align: center;
            padding: 12px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
        }
        
        header h1 { 
            font-size: 1.3em; 
            color: #ffffff; 
        }

        /* Zone de contenu principal */
        main {
            flex: 1; 
            padding: 10px;
            display: flex; 
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        /* Barre de navigation haute */
        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Boutons Accueil et Suivant */
        .btn-nav {
            flex: 1;
            padding: 12px 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95em;
            text-decoration: none; 
            border-radius: 6px; 
            border: 2px solid #ffffff;
            background: #6e4620;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* Grille photo fixe à 2 colonnes et 3 lignes (6 photos au total) */
        .photo-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            overflow: hidden;
        }

        /* Style des images de votre grille */
        .photo-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Pied de page */
        footer {
            background-color: rgba(20, 13, 10, 0.95); 
            color: #d1c2b5;
            text-align: center; 
            padding: 10px; 
            font-size: 0.85em; 
            flex-shrink: 0;
            border-top: 1px solid rgba(122, 62, 16, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Galerie Photos</h1>
    </header>

    <main>
        <!-- Barre de boutons identique à votre ancienne capture -->
        <div class="navigation-bar">
            <a href="index.html" class="btn-nav">&larr; Accueil</a>
            <a href="galerie-2.html" class="btn-nav">Suivant &rarr;</a>
        </div>

        <!-- Grille fixe de vos 6 premières photos -->
        <div class="photo-grid">
            <img src="18.jpg" alt="Photo 1">
            <img src="10.jpg" alt="Photo 2">
            <img src="11.jpg" alt="Photo 3">
            <img src="5.jpg" alt="Photo 4">
            <img src="6.jpg" alt="Photo 5">
            <img src="1.jpg" alt="Photo 6">
        </div>
    </main>

    <footer>
        <p>&copy; leboispourtous &mdash; page 1/8</p>
    </footer>

    <!-- Script d'automatisation : redirection vers la page 2 après 5 secondes -->
    <script>
        setTimeout(function() {
            window.location.href = "galerie-2.html";
        }, 5000); // 5000 millisecondes = 5 secondes
    </script>

</body>
</html>
