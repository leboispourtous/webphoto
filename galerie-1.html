<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Galerie - Leboispourtous</title>
    <style>
        /* Réinitialisation complète */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Conteneur principal fixe sans défilement */
        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            background-color: #1e140f; /* Couleur de secours */
        }

        /* Cadre du Diaporama : Il prend désormais tout l'écran en arrière-plan */
        .diaporama-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Placé tout en dessous */
        }

        /* Les images s'adaptent à 100% de la largeur et hauteur de l'écran */
        .diaporama-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Recadre proprement sans déformer les photos */
            opacity: 0; 
            transition: opacity 0.8s ease-in-out;
        }

        .diaporama-container img.active {
            opacity: 1;
        }

        /* Voile sombre pour que le titre et les boutons restent très lisibles */
        .overlay-sombre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 12, 8, 0.45);
            z-index: 2; /* Juste au-dessus des images */
        }

        /* En-tête : Placé au-dessus des images */
        header {
            position: relative;
            z-index: 3; 
            background-color: rgba(30, 20, 15, 0.85); 
            text-align: center;
            padding: 15px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
            backdrop-filter: blur(3px); 
        }
        
        header h1 { 
            font-size: 1.3em; 
            color: #d1c2b5; 
        }

        /* Zone centrale vide pour laisser admirer l'image */
        main {
            flex: 1; 
            padding: 20px;
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Pousse les boutons vers le bas de l'écran */
            gap: 25px;
            overflow: hidden;
            position: relative;
            z-index: 3;
        }

        /* Barre de navigation avec les boutons */
        .navigation-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 280px;
            flex-shrink: 0;
            margin-bottom: 10px; /* Petit espace au-dessus du pied de page */
        }

        /* Boutons Accueil et Objectifs renforcés pour le plein écran */
        .btn-nav {
            flex: 1;
            padding: 13px 10px;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95em;
            text-decoration: none; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #ffffff; /* Bordure blanche pour bien détacher le bouton */
            background: linear-gradient(145deg, #8b5a2b, #6e4620);
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            background: linear-gradient(145deg, #a65d21, #8b5a2b);
        }

        /* Pied de page : Placé tout en haut */
        footer {
            position: relative;
            z-index: 3;
            background-color: rgba(20, 13, 10, 0.9); 
            color: #aaa;
            text-align: center; 
            padding: 10px; 
            font-size: 0.75em; 
            flex-shrink: 0;
            border-top: 1px solid rgba(122, 62, 16, 0.3);
        }
    </style>
</head>
<body>

    <!-- Diaporama géant en arrière-plan total -->
    <div class="diaporama-container">
        <img src="10.jpg" alt="Création 1" class="active">
        <img src="5.jpg" alt="Création 2">
        <img src="6.jpg" alt="Création 3">
    </div>

    <!-- Voile transparent pour la lisibilité -->
    <div class="overlay-sombre"></div>

    <header>
        <h1>Galerie Photos - Leboispourtous</h1>
    </header>

    <main>
        <!-- Les boutons restent positionnés proprement au-dessus de l'image géante -->
        <div class="navigation-bar">
            <a href="index.html" class="btn-nav">Accueil</a>
            <a href="objectifs.html" class="btn-nav">Objectifs</a>
        </div>
    </main>

    <footer>
        <p>&copy; leboispourtous</p>
    </footer>

    <!-- Script de rotation fluide de 5 secondes -->
    <script>
        const images = document.querySelectorAll('.diaporama-container img');
        let indexActuel = 0;

        function changerImage() {
            images[indexActuel].classList.remove('active');
            indexActuel = (indexActuel + 1) % images.length;
            images[indexActuel].classList.add('active');
        }

        setInterval(changerImage, 5000);
    </script>

</body>
</html>
