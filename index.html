<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galerie - Leboispourtous</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* Bloque complètement le défilement vertical */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c221e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* En-tête compact */
    header {
      background-color: #1e140f;
      text-align: center;
      padding: 8px 5px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.5em;
      letter-spacing: 1px;
    }

    /* Onglets de navigation géants et fixés en haut */
    .nav-tabs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      background-color: #1e140f;
      border-bottom: 2px solid #3a2b22;
      flex-shrink: 0;
    }
    .btn-nav {
      flex: 1;
      padding: 12px 4px;
      background: linear-gradient(145deg, #8b5a2b, #6e4620);
      color: #ffffff;
      font-weight: bold;
      font-size: 0.95em;
      text-align: center;
      text-decoration: none;
      border: 2px solid #d1c2b5;
      border-radius: 8px;
      box-shadow: 0 3px 5px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    .btn-nav:disabled, .btn-nav.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: #444;
      background: #44342a;
    }

    /* Zone centrale occupant tout l'espace disponible */
    main {
      flex: 1;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Grille de 4 photos (2x2) ajustée à la hauteur de l'écran */
    .photo-grid {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .photo-grid.active {
      display: grid;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
      width: 100%;
      height: 100%;
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Pied de page compact */
    footer {
      background-color: #1a252f;
      color: #ffffff;
      text-align: center;
      padding: 6px;
      font-size: 0.8em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header>
    <h1>Leboispourtous</h1>
  </header>

  <!-- Navigation fixe -->
  <div class="nav-tabs">
    <a href="index.html" class="btn-nav">&larr; Accueil</a>
    <button id="btn-prev" class="btn-nav" onclick="changePage(-1)">&larr; Précédent</button>
    <button id="btn-next" class="btn-nav" onclick="changePage(1)">Suivant &rarr;</button>
  </div>

  <!-- Galerie sur 4 pages sans scroll -->
  <main>
    <!-- PAGE 1 (4 photos) -->
    <div id="page-1" class="photo-grid active">
      <div class="photo-card"><img src="2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="4.jpg" alt="Photo 4"></div>
      <div class="photo-card"><img src="5.jpg" alt="Photo 5"></div>
    </div>

    <!-- PAGE 2 (4 photos) -->
    <div id="page-2" class="photo-grid">
      <div class="photo-card"><img src="6.jpg" alt="Photo 6"></div>
      <div class="photo-card"><img src="7.jpg" alt="Photo 7"></div>
      <div class="photo-card"><img src="8.jpg" alt="Photo 8"></div>
      <div class="photo-card"><img src="10.jpg" alt="Photo 10"></div>
    </div>

    <!-- PAGE 3 (4 photos) -->
    <div id="page-3" class="photo-grid">
      <div class="photo-card"><img src="11.jpg" alt="Photo 11"></div>
      <div class="photo-card"><img src="12.jpg" alt="Photo 12"></div>
      <div class="photo-card"><img src="13.jpg" alt="Photo 13"></div>
      <div class="photo-card"><img src="14.jpg" alt="Photo 14"></div>
    </div>

    <!-- PAGE 4 (4 photos) -->
    <div id="page-4" class="photo-grid">
      <div class="photo-card"><img src="16.jpg" alt="Photo 16"></div>
      <div class="photo-card"><img src="17.jpg" alt="Photo 17"></div>
      <div class="photo-card"><img src="18.jpg" alt="Photo 18"></div>
      <div class="photo-card"><img src="19.jpg" alt="Photo 19"></div>
    </div>
  </main>

  <!-- Pied de page -->
  <footer>
    <p>&copy; leboispourtous — page <span id="page-num">1</span> / 4</p>
  </footer>

  <script>
    let currentPage = 1;
    const totalPages = 4;

    function updatePage() {
      for (let i = 1; i <= totalPages; i++) {
        const page = document.getElementById(`page-${i}`);
        if (page) page.classList.remove('active');
      }
      
      const activePage = document.getElementById(`page-${currentPage}`);
      if (activePage) activePage.classList.add('active');

      document.getElementById('page-num').textContent = currentPage;

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      btnPrev.disabled = (currentPage === 1);
      btnNext.disabled = (currentPage === totalPages);

      if (currentPage === 1) {
        btnPrev.classList.add('disabled');
      } else {
        btnPrev.classList.remove('disabled');
      }

      if (currentPage === totalPages) {
        btnNext.classList.add('disabled');
      } else {
        btnNext.classList.remove('disabled');
      }
    }

    function changePage(direction) {
      if (currentPage + direction >= 1 && currentPage + direction <= totalPages) {
        currentPage += direction;
        updatePage();
      }
    }

    updatePage();
  </script>

</body>
</html>
