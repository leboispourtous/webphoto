<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Accueil - Leboispourtous</title>
    <style>
        /* Réinitialisation de base */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Conteneur principal plein écran fixe sans défilement avec l'image d'origine bien nette */
        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            
            /* LIGNE CORRIGÉE : Suppression du voile sombre pour afficher l'image brute et distincte */
            background: url('1.jpg') no-repeat center center;
            background-size: cover;
        }

        /* En-tête */
        header {
            background-color: rgba(30, 20, 15, 0.85); 
            text-align: center;
            padding: 15px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
            backdrop-filter: blur(3px); 
        }
        
        header h1 { 
            font-size: 1.4em; 
            color: #d1c2b5; 
        }

        /* Zone de contenu central */
        main {
            flex: 1; 
            padding: 20px;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            gap: 25px; 
        }

        /* Groupe contenant les boutons de navigation (onglets) */
        .navigation-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 280px; 
        }

        /* Style de base des boutons (onglets) avec ombres renforcées */
        .btn-onglet {
            display: block; 
            width: 100%;
            padding: 14px 20px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.05em;
            text-decoration: none; 
            border-radius: 8px; 
            /* Ombres plus marquées pour détacher les boutons du fond clair */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        /* Style spécifique pour l'onglet Galerie */
        .btn-galerie {
            background: linear-gradient(145deg, #8b5a2b, #6e4620);
            border: 2px solid #d1c2b5;
        }

        /* Style spécifique pour l'onglet Objectifs */
        .btn-objectifs {
            background: linear-gradient(145deg, #5c3a1a, #422812);
            border: 2px solid #a65d21;
        }

        /* Effets au survol / clic */
        .btn-onglet:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
            border-color: #ffffff;
        }

        /* Pied de page */
        footer {
            background-color: rgba(20, 13, 10, 0.9); 
            color: #aaa;
            text-align: center; 
            padding: 10px; 
            font-size: 0.8em; 
            flex-shrink: 0;
            border-top: 1px solid rgba(122, 62, 16, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenue chez Leboispourtous</h1>
    </header>

    <main>
        <div class="navigation-group">
            <a href="galerie-1.html" class="btn-onglet btn-galerie" title="Voir la galerie photo">
                Voir la galerie photo &rarr;
            </a>
            
            <a href="objectifs.html" class="btn-onglet btn-objectifs" title="Découvrir nos objectifs">
                🎯 Nos Objectifs
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; leboispourtous</p>
    </footer>

</body>
</html>
