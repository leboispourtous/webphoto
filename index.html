<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - Leboispourtous</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c221e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: space-between;
    }

    /* En-tête */
    header {
      background-color: rgba(44, 34, 30, 0.95);
      color: #ffffff;
      text-align: center;
      padding: 12px 10px;
    }
    header h1 {
      font-size: 2em;
      letter-spacing: 1px;
    }

    /* Onglets de navigation géants pour faciliter la manipulation */
    .nav-tabs {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background-color: #1e140f;
    }
    .btn-nav {
      flex: 1;
      padding: 14px 10px;
      background: linear-gradient(145deg, #8b5a2b, #6e4620);
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1em;
      text-align: center;
      text-decoration: none;
      border: 2px solid #d1c2b5;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }
    .btn-nav:disabled, .btn-nav.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #555;
    }

    /* Conteneur principal */
    main {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Grille de 6 photos max par page pour ne jamais faire défiler */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }
    .photo-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }
    .photo-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    /* Pied de page */
    footer {
      background-color: #1a252f;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-size: 0.85em;
    }

    /* Gestion des pages */
    .page { display: none; }
    .page.active { display: grid; }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header>
    <h1>Leboispourtous</h1>
  </header>

  <!-- Onglets hauts : Navigation très lisible -->
  <div class="nav-tabs">
    <a href="index.html" class="btn-nav">&larr; Accueil</a>
    <button id="btn-prev" class="btn-nav" onclick="changePage(-1)">&larr; Précédent</button>
    <button id="btn-next" class="btn-nav" onclick="changePage(1)">Suivant &rarr;</button>
  </div>

  <!-- Galerie répartie sur 3 pages (sans 1.jpg, 9.jpg et 15.jpg) -->
  <main>
    <!-- PAGE 1 -->
    <div id="page-1" class="photo-grid page active">
      <div class="photo-card"><img src="2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="4.jpg" alt="Photo 4"></div>
      <div class="photo-card"><img src="5.jpg" alt="Photo 5"></div>
      <div class="photo-card"><img src="6.jpg" alt="Photo 6"></div>
      <div class="photo-card"><img src="7.jpg" alt="Photo 7"></div>
    </div>

    <!-- PAGE 2 -->
    <div id="page-2" class="photo-grid page">
      <div class="photo-card"><img src="8.jpg" alt="Photo 8"></div>
      <div class="photo-card"><img src="10.jpg" alt="Photo 10"></div>
      <div class="photo-card"><img src="11.jpg" alt="Photo 11"></div>
      <div class="photo-card"><img src="12.jpg" alt="Photo 12"></div>
      <div class="photo-card"><img src="13.jpg" alt="Photo 13"></div>
      <div class="photo-card"><img src="14.jpg" alt="Photo 14"></div>
    </div>

    <!-- PAGE 3 -->
    <div id="page-3" class="photo-grid page">
      <div class="photo-card"><img src="16.jpg" alt="Photo 16"></div>
      <div class="photo-card"><img src="17.jpg" alt="Photo 17"></div>
      <div class="photo-card"><img src="18.jpg" alt="Photo 18"></div>
      <div class="photo-card"><img src="19.jpg" alt="Photo 19"></div>
      <div class="photo-card"><img src="20.jpg" alt="Photo 20"></div>
      <div class="photo-card"><img src="21.jpg" alt="Photo 21"></div>
    </div>
  </main>

  <!-- Pied de page -->
  <footer>
    <p>&copy; leboispourtous — page <span id="page-num">1</span> / 3</p>
  </footer>

  <script>
    let currentPage = 1;
    const totalPages = 3;

    function updatePage() {
      // Masquer toutes les pages
      for (let i = 1; i <= totalPages; i++) {
        document.getElementById(`page-${i}`).classList.remove('active');
      }
      // Afficher la page en cours
      document.getElementById(`page-${currentPage}`).classList.add('active');
      document.getElementById('page-num').textContent = currentPage;

      // Gestion de l'état des boutons
      document.getElementById('btn-prev').disabled = (currentPage === 1);
      document.getElementById('btn-next').disabled = (currentPage === totalPages);

      if (currentPage === 1) {
        document.getElementById('btn-prev').classList.add('disabled');
      } else {
        document.getElementById('btn-prev').classList.remove('disabled');
      }

      if (currentPage === totalPages) {
        document.getElementById('btn-next').classList.add('disabled');
      } else {
        document.getElementById('btn-next').classList.remove('disabled');
      }
    }

    function changePage(direction) {
      if (currentPage + direction >= 1 && currentPage + direction <= totalPages) {
        currentPage += direction;
        updatePage();
      }
    }

    // Initialisation
    updatePage();
  </script>

</body>
</html>
