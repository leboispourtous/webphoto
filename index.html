<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - Leboispourtous</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #2c221e;
      color: #ffffff;
      line-height: 1.5;
    }

    /* En-tête homogène avec l'accueil */
    header {
      background-color: rgba(44, 34, 30, 0.95);
      color: #ffffff;
      text-align: center;
      padding: 15px 10px;
    }
    header h1 {
      font-size: 2.2em;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    header p {
      font-size: 1em;
      color: #d1c2b5;
    }

    /* Bouton de retour accueil bien visible */
    .nav-bar {
      text-align: center;
      padding: 12px;
      background-color: #1e140f;
    }
    .back-btn {
      display: inline-block;
      padding: 10px 18px;
      background: linear-gradient(145deg, #8b5a2b, #6e4620);
      color: #ffffff;
      font-weight: bold;
      font-size: 1em;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 3px 0 #3a220e, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* Conteneur principal de la galerie */
    main {
      padding: 15px 10px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .gallery-title {
      text-align: center;
      font-size: 1.3em;
      margin-bottom: 15px;
      color: #f0f0f0;
    }

    /* Grille de photos responsive et très claire */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    .photo-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .photo-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    /* Pied de page */
    footer {
      background-color: #1a252f;
      color: #ffffff;
      text-align: center;
      padding: 12px 10px;
      font-size: 0.85em;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header>
    <h1>Leboispourtous</h1>
    <p>Galerie photos de nos actions</p>
  </header>

  <!-- Navigation Retour -->
  <div class="nav-bar">
    <a href="index.html" class="back-btn">&larr; Retour à l'accueil</a>
  </div>

  <!-- Galerie d'images (de 1.jpg à 50.jpg) -->
  <main>
    <h2 class="gallery-title">Nos créations, collectes et activités</h2>
    <div class="photo-grid">
      <!-- Exemples de photos : vous pouvez répéter la ligne ci-dessous de 1 à 50 -->
      <div class="photo-card"><img src="1.jpg" alt="Photo 1"></div>
      <div class="photo-card"><img src="2.jpg" alt="Photo 2"></div>
      <div class="photo-card"><img src="3.jpg" alt="Photo 3"></div>
      <div class="photo-card"><img src="4.jpg" alt="Photo 4"></div>
      <div class="photo-card"><img src="5.jpg" alt="Photo 5"></div>
      <div class="photo-card"><img src="6.jpg" alt="Photo 6"></div>
      <div class="photo-card"><img src="7.jpg" alt="Photo 7"></div>
      <div class="photo-card"><img src="8.jpg" alt="Photo 8"></div>
      <div class="photo-card"><img src="9.jpg" alt="Photo 9"></div>
      <div class="photo-card"><img src="10.jpg" alt="Photo 10"></div>
      <!-- Ajoutez la suite jusqu'à 50.jpg selon vos besoins -->
    </div>
  </main>

  <!-- Pied de page -->
  <footer>
    <p style="margin-bottom: 4px;">&copy; leboispourtous — association à but non lucratif</p>
    <p style="color: #bdc3c7;">le président : letellier &nbsp;|&nbsp; le secrétaire général : tronoy</p>
  </footer>

</body>
</html>
