<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Accueil - Leboispourtous</title>
    <style>
        /* Réinitialisation de base */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Conteneur principal plein écran sans défilement */
        html, body {
            width: 100%; 
            height: 100dvh; /* S'adapte parfaitement aux écrans de téléphones récents */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c221e; 
            color: #ffffff;
            display: flex; 
            flex-direction: column;
        }

        /* En-tête */
        header {
            background-color: #1e140f; 
            text-align: center;
            padding: 15px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
        }
        
        header h1 { 
            font-size: 1.4em; 
            color: #d1c2b5; 
        }

        /* Zone de contenu central (ajustée pour éviter les débordements) */
        main {
            flex: 1; 
            padding: 15px;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            gap: 15px; /* Espacement resserré pour mobile */
        }

        /* Texte d'introduction */
        .intro {
            font-size: 1em; 
            line-height: 1.5; 
            color: #e0d0c0;
            max-width: 400px;
        }

        /* Bouton principal avec transition fluide */
        .btn-galerie {
            display: inline-block; 
            padding: 14px 28px;
            background: linear-gradient(145deg, #8b5a2b, #6e4620);
            color: #ffffff;
            font-weight: bold;
            font-size: 1.1em;
            text-decoration: none; 
            border: 2px solid #d1c2b5;
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Effet moderne au survol */
        .btn-galerie:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(139, 90, 43, 0.4);
            background: linear-gradient(145deg, #a65d21, #8b5a2b);
            border-color: #ffffff;
        }

        /* Pied de page */
        footer {
            background-color: #140d0a; 
            color: #888;
            text-align: center; 
            padding: 10px; 
            font-size: 0.8em; 
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenue chez Leboispourtous</h1>
    </header>

    <main>
        <p class="intro">
            Découvrez nos réalisations, nos chantiers et nos créations à travers notre galerie.
        </p>
        <a href="galerie-1.html" class="btn-galerie" title="Voir la galerie photo">
            Voir la galerie photo &rarr;
        </a>
    </main>

    <footer>
        <p>&copy; leboispourtous</p>
    </footer>

</body>
</html>
