<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Accueil — Leboispourtous</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background-color: #2c221e; color: #ffffff;
      display: flex; flex-direction: column;
    }
    header {
      background-color: #1e140f; text-align: center;
      padding: 15px 10px; border-bottom: 2px solid #3a2b22; flex-shrink: 0;
    }
    header h1 { font-size: 1.4em; color: #d1c2b5; }
    
    main {
      flex: 1; padding: 20px 15px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 15px;
    }
    .intro {
      font-size: 1em; line-height: 1.5; color: #e0d0c0;
      max-width: 400px; margin-bottom: 10px;
    }
    .btn-container {
      display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px;
    }
    .btn-galerie {
      display: block; padding: 12px 20px;
      background: linear-gradient(145deg, #8b5a2b, #6e4620);
      color: #ffffff; font-weight: bold; font-size: 1em;
      text-decoration: none; border: 2px solid #d1c2b5;
      border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
    }
    .btn-secondaire {
      background: linear-gradient(145deg, #44342a, #2c221e);
      border-color: #8b5a2b;
    }
    
    footer {
      background-color: #140d0a; color: #888;
      text-align: center; padding: 10px; font-size: 0.8em; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenue chez Leboispourtous</h1>
  </header>

  <main>
    <p class="intro">
      Découvrez nos réalisations, nos chantiers et nos créations.
    </p>
    
    <div class="btn-container">
      <a href="galerie-1.html" class="btn-galerie">Galerie photo &rarr;</a>
      <a href="objectifs.html" class="btn-galerie btn-secondaire">Objectifs & Enjeux &rarr;</a>
    </div>
  </main>

  <footer>
    <p>&copy; leboispourtous</p>
  </footer>

</body>
</html>
