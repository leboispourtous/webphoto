<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Accueil - Leboispourtous</title>
    <style>
        /* Réinitialisation de base */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Conteneur principal plein écran fixe sans défilement avec l'image 1.jpg nette */
        html, body {
            width: 100%; 
            height: 100dvh; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex; 
            flex-direction: column;
            background: url('1.jpg') no-repeat center center;
            background-size: cover;
        }

        /* En-tête */
        header {
            background-color: rgba(30, 20, 15, 0.85); 
            text-align: center;
            padding: 15px 10px; 
            border-bottom: 2px solid #3a2b22; 
            flex-shrink: 0;
            backdrop-filter: blur(3px); 
        }
        
        header h1 { 
            font-size: 1.4em; 
            color: #d1c2b5; 
        }

        /* Zone de contenu central */
        main {
            flex: 1; 
            padding: 20px;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            text-align: center; 
            gap: 20px; 
        }

        /* Groupe contenant les boutons de navigation (onglets) */
        .navigation-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 280px; 
        }

        /* Style de base des boutons */
        .btn-onglet {
            display: block; 
            width: 100%;
            padding: 14px 20px;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.05em;
            text-decoration: none; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        /* Style spécifique pour l'onglet Galerie */
        .btn-galerie {
            background: linear-gradient(145deg, #8b5a2b, #6e4620);
            border: 2px solid #d1c2b5;
        }

        /* Style spécifique pour l'onglet Objectifs */
        .btn-objectifs {
            background: linear-gradient(145deg, #5c3a1a, #422812);
            border: 2px solid #a65d21;
        }

        /* Bouton Audio interactif vert */
        .btn-audio {
            background: linear-gradient(145deg, #27ae60, #1e8449);
            border: 2px solid #2ecc71;
            margin-top: 10px;
        }

        /* Effets au survol / clic */
        .btn-onglet:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
            border-color: #ffffff;
        }

        /* Pied de page */
        footer {
            background-color: rgba(20, 13, 10, 0.9); 
            color: #aaa;
            text-align: center; 
            padding: 10px; 
            font-size: 0.8em; 
            flex-shrink: 0;
            border-top: 1px solid rgba(122, 62, 16, 0.3);
        }
    </style>
</head>
<body>

    <!-- Lecteur audio invisible qui tourne en boucle -->
    <audio id="monLecteur" src="musique.mp3" loop></audio>

    <header>
        <h1>Bienvenue chez Leboispourtous</h1>
    </header>

    <main>
        <div class="navigation-group">
            <!-- Bouton musical pour lancer l'ambiance sonore -->
            <button class="btn-onglet btn-audio" id="boutonSon">🎵 Activer l'ambiance sonore</button>

            <a href="galerie-1.html" class="btn-onglet btn-galerie">
                Voir la galerie photo &rarr;
            </a>
            
            <a href="objectifs.html" class="btn-onglet btn-objectifs" title="Découvrir nos objectifs">
                🎯 Nos Objectifs
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; leboispourtous</p>
    </footer>

    <script>
        const audio = document.getElementById('monLecteur');
        const bouton = document.getElementById('boutonSon');

        // Reprendre la musique là où elle s'était arrêtée sur une autre page
        if (localStorage.getItem('musicPlaying') === 'true') {
            audio.currentTime = localStorage.getItem('musicTime') || 0;
            audio.play().then(() => {
                bouton.textContent = "⏸ Mettre en pause";
                bouton.style.background = "linear-gradient(145deg, #e74c3c, #c0392b)";
                bouton.style.borderColor = "#e74c3c";
            }).catch(() => {});
        }

        bouton.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                localStorage.setItem('musicPlaying', 'true');
                bouton.textContent = "⏸ Mettre en pause";
                bouton.style.background = "linear-gradient(145deg, #e74c3c, #c0392b)";
                bouton.style.borderColor = "#e74c3c";
            } else {
                audio.pause();
                localStorage.setItem('musicPlaying', 'false');
                bouton.textContent = "🎵 Activer l'ambiance sonore";
                bouton.style.background = "linear-gradient(145deg, #27ae60, #1e8449)";
                bouton.style.borderColor = "#2ecc71";
            }
        });

        // Sauvegarder la position de lecture en continu
        setInterval(() => {
            if (!audio.paused) { 
                localStorage.setItem('musicTime', audio.currentTime); 
            }
        }, 500);
    </script>
</body>
</html>
