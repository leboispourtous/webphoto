<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galerie - Page 6</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background-color: #2c221e; color: #ffffff;
      display: flex; flex-direction: column;
    }
    header { background-color: #1e140f; text-align: center; padding: 6px; flex-shrink: 0; }
    header h1 { font-size: 1.2em; }

    .nav-tabs {
      display: flex; justify-content: space-between; gap: 6px;
      padding: 6px; background-color: #1e140f;
      border-bottom: 2px solid #3a2b22; flex-shrink: 0;
    }
    .btn-nav {
      flex: 1; padding: 8px 2px;
      background: linear-gradient(145deg, #8b5a2b, #6e4620);
      color: #ffffff; font-weight: bold; font-size: 0.85em;
      text-align: center; text-decoration: none;
      border: 2px solid #d1c2b5; border-radius: 6px;
    }

    main { flex: 1; padding: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px; width: 100%; height: 100%;
      max-width: 450px; margin: 0 auto;
    }

    .photo-card {
      background: #ffffff; border-radius: 4px;
      overflow: hidden; width: 100%; height: 100%;
    }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

    footer {
      background-color: #140d0a; color: #ffffff;
      text-align: center; padding: 5px; font-size: 0.75em; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Galerie Photos</h1>
  </header>

  <div class="nav-tabs">
    <a href="index.html" class="btn-nav">&larr; Accueil</a>
    <a href="galerie-5.html" class="btn-nav">&larr; Précédent</a>
    <a href="galerie-7.html" class="btn-nav">Suivant &rarr;</a>
  </div>

  <main>
    <div class="photo-grid">
      <div class="photo-card"><img src="35.jpg" alt="Photo 35"></div>
      <div class="photo-card"><img src="36.jpg" alt="Photo 36"></div>
      <div class="photo-card"><img src="37.jpg" alt="Photo 37"></div>
      <div class="photo-card"><img src="38.jpg" alt="Photo 38"></div>
      <div class="photo-card"><img src="39.jpg" alt="Photo 39"></div>
      <div class="photo-card"><img src="40.jpg" alt="Photo 40"></div>
    </div>
  </main>

  <footer>
    <p>&copy; leboispourtous — page 6 / 8</p>
  </footer>

</body>
</html>
